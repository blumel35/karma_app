<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"></head>
<body style="margin:0">
<script>
/* "Beni hatırla" çerezi için küçük, ONAYLI okuma/yazma/silme bileşeni.
   Her işlem bir `nonce` taşır; iş bitince (yazıldıktan sonra çerez GERİ OKUNUP doğrulanır)
   {nonce, op, ok, value} Python'a döner. Python tarafı bu onayı almadan sayfadan
   ayrılmaz — böylece "sabit süre bekle" yarışı (yavaş cihazda çerez hiç yazılmıyordu) biter. */
function gonder(tip,veri){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:tip},veri),'*')}
function oku(ad){
  var p=document.cookie?document.cookie.split('; '):[];
  for(var i=0;i<p.length;i++){
    if(p[i].indexOf(ad+'=')===0){try{return decodeURIComponent(p[i].slice(ad.length+1))}catch(e){return p[i].slice(ad.length+1)}}
  }
  return null;
}
var son=null;
window.addEventListener('message',function(e){
  var m=e.data||{};if(m.type!=='streamlit:render')return;
  var a=m.args||{};
  if(!a.nonce||a.nonce===son)return;
  son=a.nonce;
  var sonuc={nonce:a.nonce,op:a.op,ok:false,value:null};
  try{
    var guvenli=(location.protocol==='https:')?'; Secure':'';
    if(a.op==='write'){
      document.cookie=a.ad+'='+encodeURIComponent(a.deger)+'; Max-Age='+Math.floor(a.sure)+'; Path=/; SameSite=Lax'+guvenli;
      sonuc.ok=(oku(a.ad)===a.deger);
    }else if(a.op==='remove'){
      document.cookie=a.ad+'=; Max-Age=0; Path=/; SameSite=Lax'+guvenli;
      document.cookie=a.ad+'=; Max-Age=0; Path=/; SameSite=Strict'+guvenli;   // eski sürüm Strict yazıyordu
      sonuc.ok=(oku(a.ad)===null);
    }else{
      sonuc.value=oku(a.ad);sonuc.ok=true;
    }
  }catch(err){sonuc.err=String(err)}
  gonder('streamlit:setComponentValue',{value:sonuc,dataType:'json'});
});
gonder('streamlit:componentReady',{apiVersion:1});
gonder('streamlit:setFrameHeight',{height:0});
</script>
</body></html>
