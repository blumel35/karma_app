<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#fff;--ink:#1c2b47;--muted:#6b7385;--line:#e1e4e9;--line2:#c9ced6;--head:#f3f4f6;--navy:#1c2b47;--sel:#e8edf7;--act:#fdf3d9;--red:#b42318}
  *{box-sizing:border-box}
  body{margin:0;background:transparent;color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Inter,sans-serif;font-size:13.5px;line-height:1.35}
  .wrap{border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:auto;max-height:470px}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
  th{position:sticky;top:0;z-index:2;background:var(--head);text-align:left;font-weight:700;font-size:12.5px;color:var(--ink);border-bottom:1px solid var(--line2);border-right:1px solid var(--line);padding:0;white-space:nowrap}
  th .h{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 10px}
  th .lbl{cursor:pointer;flex:1;user-select:none}
  th .ar{color:var(--navy);font-size:11px}
  th .fb{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:12px;padding:3px 5px;border-radius:5px;line-height:1}
  th .fb:hover{background:#e0e3e8}
  th .fb.on{background:var(--navy);color:#fff}
  td{border-bottom:1px solid var(--line);border-right:1px solid #f0f1f4;padding:8px 10px;vertical-align:top;overflow:hidden;text-overflow:ellipsis}
  tr.r{cursor:pointer}
  tr.r:hover td{background:#f8f9fb}
  tr.r.s td{background:var(--sel)}
  tr.r.a td{background:var(--act)}
  .ck{width:38px;text-align:center;padding:0 !important}
  .ck input{width:17px;height:17px;cursor:pointer;margin:9px 0 0}
  .ck input.hp{margin:0}
  .yeni{display:inline-block;background:#fde8e6;color:var(--red);font-weight:800;font-size:10px;border-radius:5px;padding:1px 5px;margin-right:6px;vertical-align:1px}
  a.il{color:#0369a1;font-weight:700;text-decoration:none;white-space:nowrap}
  a.il:hover{text-decoration:underline}
  .alt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 2px 0;font-size:12.5px;color:var(--muted)}
  .alt button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink)}
  .bos{padding:28px;text-align:center;color:var(--muted)}
  /* filtre açılır penceresi */
  .pop{position:fixed;z-index:20;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 28px rgba(28,43,71,.22);width:250px;padding:8px}
  .pop input[type=text]{width:100%;border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;margin-bottom:6px}
  .pop .lst{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:3px}
  .pop label{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:13px}
  .pop label:hover{background:#f3f4f6}
  .pop label span.n{margin-left:auto;color:var(--muted);font-size:11.5px;padding-left:6px}
  .pop .ac{display:flex;gap:6px;margin-top:7px}
  .pop .ac button{flex:1;border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  .pop .ac button.p{background:var(--navy);color:#fff;border-color:var(--navy)}
</style>
</head>
<body>
<div id="app"></div>
<script>
var st={kol:[],satir:[],f:{},sirala:null,sec:{},aktif:null,acik:null,ara:'',ilk:true,imza:null},sayac=0;
function gonder(tip,veri){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:tip},veri),'*')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function tr(s){return String(s||'').toLocaleLowerCase('tr')}
function deger(){gonder('streamlit:setComponentValue',{dataType:'json',value:{sec:Object.keys(st.sec),aktif:st.aktif,n:Date.now()*1000+(sayac++%1000)}})}
function boyut(){var h=document.getElementById('app').offsetHeight+8;if(st.acik)h=Math.max(h,430);gonder('streamlit:setFrameHeight',{height:h})}
function gecer(r,haric){for(var i=0;i<st.kol.length;i++){var k=st.kol[i].k;if(k===haric)continue;var f=st.f[k];if(f&&!f[r.h[k]||'—'])return false}return true}
function gorunen(){
  var l=st.satir.filter(function(r){return gecer(r,null)});
  if(st.sirala){var k=st.sirala.k,y=st.sirala.y,kol=st.kol.filter(function(c){return c.k===k})[0];
    l=l.slice().sort(function(a,b){
      if(kol&&kol.sk){return (a.t-b.t)*y}
      return String(a.h[k]||'').localeCompare(String(b.h[k]||''),'tr',{numeric:true})*y})}
  return l}
function tumDegerler(k){var c={};st.satir.forEach(function(r){if(!gecer(r,k))return;var v=r.h[k]||'—';c[v]=(c[v]||0)+1});return c}
function ciz(){
  var l=gorunen(),h='<div class="wrap"><table><thead><tr><th class="ck"><div class="h" style="justify-content:center;padding:8px 0"><input type="checkbox" id="hepsi" class="hp"'+(l.length&&l.every(function(r){return st.sec[r.id]})?' checked':'')+' style="width:17px;height:17px;cursor:pointer"></div></th>';
  st.kol.forEach(function(c){
    var on=!!st.f[c.k],ar=st.sirala&&st.sirala.k===c.k?(st.sirala.y>0?' ▲':' ▼'):'';
    if(c.link){h+='<th style="min-width:'+(c.w||70)+'px"><div class="h"><span class="lbl" style="cursor:default">'+esc(c.label)+'</span></div></th>';return}
    h+='<th style="min-width:'+(c.w||110)+'px"><div class="h"><span class="lbl" data-s="'+esc(c.k)+'">'+esc(c.label)+'<span class="ar">'+ar+'</span></span><button class="fb'+(on?' on':'')+'" data-f="'+esc(c.k)+'" title="Filtre">▾</button></div></th>'});
  h+='</tr></thead><tbody>';
  if(!l.length){h+='<tr><td colspan="'+(st.kol.length+1)+'" class="bos">Filtreye uyan kayıt yok.</td></tr>'}
  l.forEach(function(r){
    h+='<tr class="r'+(st.sec[r.id]?' s':'')+(st.aktif===r.id?' a':'')+'" data-id="'+esc(r.id)+'"><td class="ck"><input type="checkbox" data-c="'+esc(r.id)+'"'+(st.sec[r.id]?' checked':'')+'></td>';
    st.kol.forEach(function(c,i){
      if(c.link){h+='<td>'+(r.u&&/^https?:\/\//i.test(r.u)?'<a class="il" href="'+esc(r.u)+'" target="_blank" rel="noopener noreferrer">↗ İlan</a>':'—')+'</td>';return}
      var v=r.h[c.k]||'—';
      h+='<td>'+((i===0&&r.yeni)?'<span class="yeni">YENİ</span>':'')+esc(v)+'</td>'});
    h+='</tr>'});
  h+='</tbody></table></div>';
  var nf=Object.keys(st.f).length,ns=Object.keys(st.sec).length;
  h+='<div class="alt"><span>'+l.length+' / '+st.satir.length+' kayıt</span><span>·</span><span>'+ns+' seçili</span>'
    +(nf||st.sirala?'<button id="temizle">Filtre ve sıralamayı temizle</button>':'')
    +(ns?'<button id="secTemizle">Seçimi kaldır</button>':'')+'</div>';
  if(st.acik){h+=popHtml()}
  document.getElementById('app').innerHTML=h;
  bagla();boyut()}
function popHtml(){
  var k=st.acik,c=tumDegerler(k),f=st.f[k],q=tr(st.ara);
  var anah=Object.keys(c).filter(function(v){return !q||tr(v).indexOf(q)>-1}).sort(function(a,b){return a.localeCompare(b,'tr',{numeric:true})});
  var th=document.querySelector('[data-f="'+k.replace(/"/g,'\\"')+'"]'),x=20,y=60;
  if(th){var b=th.getBoundingClientRect();x=Math.min(Math.max(4,b.left-200),window.innerWidth-262);y=Math.min(b.bottom+4,Math.max(4,window.innerHeight-300))}
  var h='<div class="pop" style="left:'+x+'px;top:'+y+'px"><input type="text" id="ara" placeholder="Ara..." value="'+esc(st.ara)+'">'
   +'<div class="lst"><label><input type="checkbox" id="tum"'+(!f?' checked':'')+'> <b>(Tümünü seç)</b></label>';
  anah.forEach(function(v){h+='<label><input type="checkbox" data-v="'+esc(v)+'"'+((!f||f[v])?' checked':'')+'><span>'+esc(v)+'</span><span class="n">'+c[v]+'</span></label>'});
  if(!anah.length)h+='<div class="bos" style="padding:10px">Sonuç yok</div>';
  h+='</div><div class="ac"><button id="fTemizle">Temizle</button><button class="p" id="fKapat">Tamam</button></div></div>';return h}
function bagla(){
  var q=function(s){return document.querySelectorAll(s)};
  Array.prototype.forEach.call(q('[data-s]'),function(e){e.onclick=function(){var k=e.dataset.s;
    if(!st.sirala||st.sirala.k!==k)st.sirala={k:k,y:1};else if(st.sirala.y===1)st.sirala={k:k,y:-1};else st.sirala=null;ciz()}});
  Array.prototype.forEach.call(q('[data-f]'),function(e){e.onclick=function(ev){ev.stopPropagation();st.acik=(st.acik===e.dataset.f?null:e.dataset.f);st.ara='';ciz()}});
  Array.prototype.forEach.call(q('tr.r'),function(e){e.onclick=function(){st.aktif=e.dataset.id;ciz();deger()}});
  Array.prototype.forEach.call(q('a.il'),function(e){e.onclick=function(ev){ev.stopPropagation()}});
  Array.prototype.forEach.call(q('[data-c]'),function(e){e.onclick=function(ev){ev.stopPropagation()};e.onchange=function(){var id=e.dataset.c;if(e.checked)st.sec[id]=1;else delete st.sec[id];ciz();deger()}});
  var hepsi=document.getElementById('hepsi');if(hepsi)hepsi.onchange=function(){var l=gorunen();l.forEach(function(r){if(hepsi.checked)st.sec[r.id]=1;else delete st.sec[r.id]});ciz();deger()};
  var t=document.getElementById('temizle');if(t)t.onclick=function(){st.f={};st.sirala=null;ciz()};
  var s=document.getElementById('secTemizle');if(s)s.onclick=function(){st.sec={};ciz();deger()};
  if(st.acik){
    var k=st.acik,pop=document.querySelector('.pop');
    pop.onclick=function(ev){ev.stopPropagation()};
    var ara=document.getElementById('ara');ara.oninput=function(){st.ara=ara.value;var p=ara.selectionStart;ciz();var a2=document.getElementById('ara');a2.focus();a2.setSelectionRange(p,p)};
    document.getElementById('tum').onchange=function(){delete st.f[k];ciz()};
    Array.prototype.forEach.call(q('[data-v]'),function(e){e.onchange=function(){
      var c=tumDegerler(k);if(!st.f[k]){st.f[k]={};Object.keys(c).forEach(function(v){st.f[k][v]=1})}
      if(e.checked)st.f[k][e.dataset.v]=1;else delete st.f[k][e.dataset.v];
      if(Object.keys(c).every(function(v){return st.f[k][v]}))delete st.f[k];ciz()}});
    document.getElementById('fTemizle').onclick=function(){delete st.f[k];ciz()};
    document.getElementById('fKapat').onclick=function(){st.acik=null;ciz()}}}
document.addEventListener('click',function(){if(st.acik){st.acik=null;ciz()}});
window.addEventListener('message',function(e){
  var m=e.data||{};if(m.type!=='streamlit:render')return;var a=m.args||{};
  var imza=JSON.stringify([a.kolonlar,a.satirlar.map(function(r){return r.id})]);
  st.kol=a.kolonlar||[];st.satir=(a.satirlar||[]).map(function(r){return{id:r.id,yeni:r.yeni,t:r.t||0,h:r.h,u:r.u||''}});
  if(st.imza!==imza){ // yeni veri: durumu sıfırla, Python'dan gelen seçimi al
    st.imza=imza;st.f={};st.sirala=null;st.acik=null;st.sec={};(a.secili0||[]).forEach(function(i){st.sec[i]=1});st.aktif=a.aktif0||null}
  ciz()});
if(window.ResizeObserver){new ResizeObserver(function(){boyut()}).observe(document.getElementById('app'))}
gonder('streamlit:componentReady',{apiVersion:1});
gonder('streamlit:setFrameHeight',{height:300});
</script>
</body>
</html>
